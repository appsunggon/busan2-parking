<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부산 공영주차장</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>부산 공영주차장</h1>
    <p>실시간 빈자리와 주차장 기본정보를 조회합니다.</p>
  </header>
  <main>
    <div class="toolbar">
      <label for="type">조회 종류</label>
      <select id="type">
        <option value="live">실시간 주차현황</option>
        <option value="city">전체 주차장 기본정보</option>
      </select>
      <button id="refresh" type="button">조회하기</button>
    </div>
    <label for="search">주차장 검색</label>
    <input id="search" type="search" placeholder="주차장명 또는 주소 입력">
    <p id="status" role="status" aria-live="polite">조회 준비 중입니다.</p>
    <section id="parking-list" aria-label="주차장 목록"></section>
  </main>
  <footer>출처: 부산광역시 · 부산시설공단<br>제공기관 갱신시각과 현장 안내를 확인하세요.</footer>
  <script src="app.js" defer></script>
</body>
</html>
